version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # react, react-dom and their types must stay on the same major version
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      vite:
        patterns: [vite, "@vitejs/*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
